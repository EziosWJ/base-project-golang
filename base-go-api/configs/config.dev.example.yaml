# 开发环境配置模板。
# 复制为 configs/config.dev.yaml 后填写本机数据库凭据与 JWT 密钥：
#   cp configs/config.dev.example.yaml configs/config.dev.yaml
# config.dev.yaml 已被 Git 忽略，不会提交。
swagger:
  enabled: true

database:
  url: postgres://127.0.0.1:5432/base_go_api?sslmode=disable
  username: change-me
  password: change-me

jwt:
  secret: replace-with-a-random-local-development-jwt-secret

auth:
  login_guard:
    # Set either max_attempts to 0 to disable that protection dimension.
    ip_max_attempts: 20
    username_max_attempts: 5

file:
  # 必须替换为当前机器上的绝对路径；本机开发建议放在项目根目录 .data/uploads。
  storage_root: /home/your-user/project/base-project-golang/.data/uploads

log:
  level: debug
  format: text
