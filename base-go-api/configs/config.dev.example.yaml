# 开发环境配置模板。请勿手工复制：在仓库根目录运行 `task init` 生成 configs/config.dev.yaml。
#   task init                        # 默认 PostgreSQL
#   task init -- --database sqlite   # 无需外部数据库
# 生成时写入随机 JWT 密钥与本机绝对上传目录，并按所选数据库调整 database 节。
# config.dev.yaml 已被 Git 忽略，不会提交。
swagger:
  enabled: true

database:
  # PostgreSQL 需要 url 加 username/password；SQLite 只需要 url（数据库文件路径），
  # 不配置 username/password，应用会管理 WAL、外键和忙等待参数。
  driver: postgres
  url: postgres://127.0.0.1:5432/base_go_api?sslmode=disable
  username: change-me
  password: change-me

jwt:
  secret: replace-with-a-random-local-development-jwt-secret

auth:
  login_guard:
    # Set either max_attempts to 0 to disable that protection dimension.
    ip_max_attempts: 20
    username_max_attempts: 5

file:
  # 生成时会填为本检出的绝对路径；手工修改后同样必须是绝对路径。
  storage_root: /home/your-user/project/base-project-golang/.data/uploads
  default_storage: local
  business_storage:
    # 头像必须显式保持本地存储。
    avatar: local
  # 启用 Cloudflare R2 时取消注释并填入真实值；凭据只放在后端配置，不提交。
  # s3:
  #   endpoint: https://YOUR_ACCOUNT_ID.r2.cloudflarestorage.com
  #   bucket: YOUR_PRIVATE_BUCKET
  #   access_key_id: YOUR_R2_ACCESS_KEY_ID
  #   secret_access_key: YOUR_R2_SECRET_ACCESS_KEY
  #   presign_ttl: 5m

log:
  level: debug
  format: text
