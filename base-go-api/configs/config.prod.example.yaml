# 生产环境配置模板，默认使用 PostgreSQL；也可按下方注释切换为 SQLite 单实例部署。
# 实际 configs/config.prod.yaml 以只读文件或挂载方式由部署系统提供，不提交 Git。
# 所有占位符值必须在部署时替换为真实值。
swagger:
  enabled: false

database:
  # PostgreSQL is the default for multi-instance or higher-write deployments.
  driver: postgres
  url: postgres://db.example.internal:5432/base_go_api?sslmode=require
  username: change-me
  password: change-me

# SQLite 单实例生产配置（启用时替换上面的整个 database 节）：
# database:
#   driver: sqlite
#   url: /var/lib/base-go-api/data/base-go-api.db
#   # SQLite 不配置 username/password；请使用本地持久卷和单个 API 实例。

# 文件存储：默认本地；使用私有 R2 Bucket 时取消注释并填写真实凭据。
# file:
#   default_storage: local
#   business_storage:
#     avatar: local
#   s3:
#     endpoint: https://YOUR_ACCOUNT_ID.r2.cloudflarestorage.com
#     bucket: YOUR_PRIVATE_BUCKET
#     access_key_id: YOUR_R2_ACCESS_KEY_ID
#     secret_access_key: YOUR_R2_SECRET_ACCESS_KEY
#     presign_ttl: 5m

jwt:
  secret: change-me

auth:
  login_guard:
    ip_max_attempts: 20
    username_max_attempts: 5

log:
  level: info
  format: json
